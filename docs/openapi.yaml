openapi: 3.0.3
info:
  title: Plataforma de Cursos Online
  version: 1.0.0
  description: API REST do Projeto Integrador Back-End (Django + DRF + JWT).
paths:
  /api/alunos/:
    get:
      operationId: alunos_list
      parameters:
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - alunos
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
