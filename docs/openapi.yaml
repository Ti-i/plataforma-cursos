components:
  schemas:
    Aluno:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        data_cadastro:
          type: string
          format: date
          readOnly: true
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - data_cadastro
      - email
      - id
      - nome
    AlunoMultiplosCursosRelatorio:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        total_cursos:
          type: integer
      required:
      - id
      - nome
      - total_cursos
    CargaHorariaRelatorio:
      type: object
      properties:
        nome:
          type: string
        carga_total:
          type: integer
      required:
      - carga_total
      - nome
    ConcluintesRelatorio:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
        concluintes:
          type: integer
      required:
      - concluintes
      - id
      - titulo
    Curso:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 150
        descricao:
          type: string
        carga_horaria:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Carga horária em horas
        ativo:
          type: boolean
        instrutor:
          type: integer
        instrutor_nome:
          type: string
